[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pack-companions-sdk"
version = "0.0.1"
description = "Python SDK for the Pack Companions service — AI companions across the Pack ecosystem."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "GetPacked"}
]
license = {text = "MIT"}
keywords = ["pack-companions", "ai", "companions", "getpacked"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/TravisRaygoza/pack-companions-sdk"
Repository = "https://github.com/TravisRaygoza/pack-companions-sdk"
Issues = "https://github.com/TravisRaygoza/pack-companions-sdk/issues"
"Service repo" = "https://github.com/TravisRaygoza/pack-companions"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pack_companions*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
